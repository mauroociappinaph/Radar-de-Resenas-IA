<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email de Mauro Ciappina</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8f9fa;
            padding: 20px;
        }

        .email-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
        }

        .content {
            padding: 40px;
        }

        .greeting {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .main-content {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }

        .highlight-box {
            background-color: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .highlight-box strong {
            color: #667eea;
        }

        .stats {
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #e1f5fe;
        }

        .stats strong {
            color: #0288d1;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .signature {
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            margin-top: 40px;
            text-align: center;
            color: #666;
        }

        .signature strong {
            color: #333;
            font-size: 18px;
        }

        .signature .title {
            color: #667eea;
            font-weight: 500;
        }

        .footer {
            background-color: #f8f9fa;
            padding: 20px 40px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .social-links {
            margin: 15px 0;
        }

        .social-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
        }

        @media only screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header,
            .content,
            .footer {
                padding: 20px;
            }

            .cta-button {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h1>🚀 Estrategia Digital Personalizada</h1>
        </div>

        <div class="content">
            <div class="greeting">{{GREETING}}</div>

            <div class="main-content">
                {{MAIN_CONTENT}}
            </div>

            {{CTA_BUTTON}}

            <div class="signature">
                <strong>Mauro Ciappina</strong><br>
                <span class="title">Desarrollador IA</span>
            </div>
        </div>

        <div class="footer">
            <div class="social-links">
                <a href="#">LinkedIn</a> |
                <a href="#">Website</a> |
                <a href="#">Contacto</a>
            </div>
        </div>
    </div>
</body>

</html>
